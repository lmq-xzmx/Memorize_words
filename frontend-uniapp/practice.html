<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习练习 - 英语学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .practice-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .header-title {
            text-align: center;
        }
        
        .title-text {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            display: block;
            margin-bottom: 8px;
        }
        
        .subtitle-text {
            font-size: 16px;
            color: #7f8c8d;
        }
        
        .mode-selector {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .selector-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }
        
        .selector-desc {
            font-size: 16px;
            color: #7f8c8d;
            text-align: center;
            display: block;
            margin-bottom: 30px;
        }
        
        .mode-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .mode-item {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .mode-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }
        
        .mode-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .mode-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .mode-item.active .mode-icon {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .mode-content {
            text-align: center;
        }
        
        .mode-name {
            font-size: 20px;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }
        
        .mode-desc {
            font-size: 14px;
            color: #7f8c8d;
            display: block;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .mode-item.active .mode-desc {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .mode-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #95a5a6;
        }
        
        .mode-item.active .mode-meta {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 30px auto 0;
            display: block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 15px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .nav-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: #667eea;
            color: white;
        }
        
        @media (max-width: 768px) {
            .practice-container {
                padding: 15px;
            }
            
            .mode-list {
                grid-template-columns: 1fr;
            }
            
            .navigation {
                bottom: 10px;
                left: 10px;
                right: 10px;
                transform: none;
            }
            
            .nav-links {
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <div class="practice-container">
        <div class="header">
            <div class="header-title">
                <span class="title-text">学习练习</span>
                <span class="subtitle-text">选择适合你的练习模式</span>
            </div>
        </div>
        
        <div class="mode-selector">
            <span class="selector-title">选择练习模式</span>
            <span class="selector-desc">根据你的需要选择合适的练习方式</span>
            
            <div class="mode-list">
                <div class="mode-item" onclick="selectMode('choice')">
                    <div class="mode-icon">
                        <span>📝</span>
                    </div>
                    <div class="mode-content">
                        <span class="mode-name">选择题练习</span>
                        <span class="mode-desc">通过选择题的形式练习单词，适合快速记忆</span>
                        <div class="mode-meta">
                            <span class="meta-item">100 个单词</span>
                            <span class="meta-divider">•</span>
                            <span class="meta-item">15分钟</span>
                        </div>
                    </div>
                </div>
                
                <div class="mode-item" onclick="selectMode('spelling')">
                    <div class="mode-icon">
                        <span>✍️</span>
                    </div>
                    <div class="mode-content">
                        <span class="mode-name">拼写练习</span>
                        <span class="mode-desc">根据中文意思拼写英文单词，加强记忆</span>
                        <div class="mode-meta">
                            <span class="meta-item">50 个单词</span>
                            <span class="meta-divider">•</span>
                            <span class="meta-item">20分钟</span>
                        </div>
                    </div>
                </div>
                
                <div class="mode-item" onclick="selectMode('listening')">
                    <div class="mode-icon">
                        <span>🎧</span>
                    </div>
                    <div class="mode-content">
                        <span class="mode-name">听力练习</span>
                        <span class="mode-desc">听音识词，提高听力和发音能力</span>
                        <div class="mode-meta">
                            <span class="meta-item">80 个单词</span>
                            <span class="meta-divider">•</span>
                            <span class="meta-item">25分钟</span>
                        </div>
                    </div>
                </div>
                
                <div class="mode-item" onclick="selectMode('review')">
                    <div class="mode-icon">
                        <span>🔄</span>
                    </div>
                    <div class="mode-content">
                        <span class="mode-name">复习模式</span>
                        <span class="mode-desc">复习之前学过的单词，巩固记忆</span>
                        <div class="mode-meta">
                            <span class="meta-item">个性化</span>
                            <span class="meta-divider">•</span>
                            <span class="meta-item">10-30分钟</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="start-btn" onclick="startPractice()">开始练习</button>
        </div>
    </div>
    
    <div class="navigation">
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/word.html" class="nav-link">斩词</a>
            <a href="/tools.html" class="nav-link">工具</a>
            <a href="/profile.html" class="nav-link">我的</a>
        </div>
    </div>
    
    <script>
        let selectedMode = null;
        
        function selectMode(mode) {
            // 移除之前的选中状态
            document.querySelectorAll('.mode-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // 添加当前选中状态
            event.currentTarget.classList.add('active');
            selectedMode = mode;
            
            console.log('选择练习模式:', mode);
        }
        
        function startPractice() {
            if (!selectedMode) {
                alert('请先选择一个练习模式');
                return;
            }
            
            alert(`即将开始${selectedMode}练习模式！\n\n这是一个演示页面，实际功能需要连接到后端API。`);
            
            // 这里可以跳转到具体的练习页面
            // window.location.href = `/practice/${selectedMode}`;
        }
        
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('学习练习页面加载完成');
            
            // 可以在这里添加页面初始化逻辑
            // 比如从API获取用户的练习历史等
        });
    </script>
</body>
</html>
